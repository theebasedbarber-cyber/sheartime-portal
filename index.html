<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time | Home</title>

  <style>
    body {
      background-color: #fafafa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }
    img.logo {
      width: 100px;
      margin-bottom: 15px;
    }
    h1 {
      color: #b22222;
    }
    p {
      color: #333;
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      background-color: #b22222;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      background-color: #8b1a1a;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/shear-time-logo.png" alt="Shear Time Logo" class="logo" />
    <h1>Welcome to Shear Time</h1>
    <p>Your professional barber booking and management portal.</p>
    <a href="login.html">Enter Portal</a>
  </div>
</body>
</html>
