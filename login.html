<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  // ✅ Correct Firebase project (same as dashboard & appointments)
  const firebaseConfig = {
    apiKey: "AIzaSyATJ7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
    authDomain: "shear-time-86b38.firebaseapp.com",
    projectId: "shear-time-86b38",
    storageBucket: "shear-time-86b38.firebasestorage.app",
    messagingSenderId: "335604759855",
    appId: "1:335604759855:web:03ea774f849224e63575da"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Keep session between reloads
  await setPersistence(auth, browserLocalPersistence);

  // If already logged in, send straight to dashboard
  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("Already signed in:", user.email);
      window.location.href = "dashboard.html";
    }
  });

  // Handle Login
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("Login successful!");
      window.location.href = "dashboard.html";
    } catch (err) {
      alert("Error: " + err.message);
      console.error(err);
    }
  });

  // Handle Signup
  document.getElementById("signupBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("Account created successfully!");
      window.location.href = "dashboard.html";
    } catch (err) {
      alert("Error: " + err.message);
      console.error(err);
    }
  });
</script>
