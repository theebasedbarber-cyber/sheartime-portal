<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time | Barber Portal</title>

  <!-- ✅ Link global stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="auth-container">
    <img src="/shear-time-logo.png" alt="Shear Time Logo" class="logo" />
    <h2>Shear Time Barber Portal</h2>

    <form id="authForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />

      <div class="button-group">
        <button type="button" id="signupBtn" class="btn">Create Account</button>
        <button type="button" id="loginBtn" class="btn">Login</button>
      </div>

      <a href="#" id="forgotPassword" class="forgot-password">Forgot password?</a>
    </form>
  </div>

  <!-- ✅ Firebase v12.4.0 SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    // 🔥 Your new Firebase project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "651072030915",
      appId: "1:651072030915:web:4dcd3b870744c22ef1ba76"
    };

    // ✅ Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ✂️ Create Account
    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("Account created successfully!");
        window.location.href = "dashboard.html";
      } catch (error) {
        alert(error.message);
      }
    });

    // 💈 Login
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "dashboard.html";
      } catch (error) {
        alert(error.message);
      }
    });

    // 🔑 Forgot Password
    document.getElementById("forgotPassword").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        alert("Enter your email to reset password.");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        alert("Password reset link sent!");
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
</body>
</html>
