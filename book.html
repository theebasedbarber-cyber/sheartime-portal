<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment | Shear Time Barber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="booking-container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" class="logo small-logo">
    <h2>Shear Time Barber</h2>
    <p>Book your appointment below</p>

    <input type="text" id="clientName" placeholder="Your Name">
    <select id="service">
      <option value="cut-$60">Cut - $60</option>
    </select>

    <label>Choose Date</label>
    <input type="date" id="datePicker">

    <label>Choose Time</label>
    <input type="time" id="timePicker">

    <button id="bookBtn">Book Appointment</button>
    <p id="successMsg" class="success-message" style="display:none;">Appointment booked successfully!</p>
    <p id="errorMsg" class="error-message" style="display:none;">Something went wrong. Please try again.</p>
  </div>
  <footer>© 2025 Shear Time | All rights reserved</footer>

  <script>
    // You can add booking logic here later
  </script>
</body>
</html>
