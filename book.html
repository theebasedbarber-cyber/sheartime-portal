<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment | Shear Time</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #f3f3f3;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    img {
      width: 90px;
      margin-bottom: 10px;
    }

    h2 {
      color: #8b0000;
      margin-bottom: 10px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 12px;
      font-weight: bold;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      background-color: #b22222;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #8b1a1a;
    }

    .success {
      background: #c9f7c2;
      color: #155724;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      display: none;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" />
    <h2 id="barberName">Shear Time Barber</h2>
    <p>Book your appointment below</p>

    <form id="bookingForm">
      <label for="clientName">Your Name</label>
      <input type="text" id="clientName" placeholder="Enter your name" required />

      <label for="service">Select Service</label>
      <select id="service" required>
        <option value="">Loading services...</option>
      </select>

      <label for="datetime">Choose Date & Time</label>
      <input type="datetime-local" id="datetime" required />

      <button type="submit">Book Appointment</button>
    </form>

    <div class="success" id="successMsg">✅ Appointment booked successfully!</div>
    <div class="error" id="errorMsg">❌ Something went wrong. Please try again.</div>
  </div>

  <!-- ✅ Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      databaseURL: "https://shear-time-portal-default-rtdb.firebaseio.com/",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "65107230915",
      appId: "1:65107230915:web:4cdcd3b070744c22ef1ba76"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const barberId = urlParams.get("barber");

    const barberNameEl = document.getElementById("barberName");
    const serviceSelect = document.getElementById("service");
    const bookingForm = document.getElementById("bookingForm");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");

    if (!barberId) {
      barberNameEl.textContent = "Invalid Barber Link";
      bookingForm.style.display = "none";
    } else {
      // Fetch barber profile info
      const dbRef = ref(db);
      get(child(dbRef, "users/" + barberId + "/profile")).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          barberNameEl.textContent = data.name
            ? `${data.name} @ ${data.shopName || "Shear Time"}`
            : "Shear Time Barber";
        }
      });

      // Load services for that barber
      get(child(dbRef, "users/" + barberId + "/services")).then((snapshot) => {
        serviceSelect.innerHTML = "";
        if (snapshot.exists()) {
          const services = snapshot.val();
          Object.values(services).forEach((s) => {
            const option = document.createElement("option");
            option.value = s.name;
            option.textContent = `${s.name} - $${s.price}`;
            serviceSelect.appendChild(option);
          });
        } else {
          serviceSelect.innerHTML =
            "<option value=''>No services available yet</option>";
        }
      });
    }

    // Handle form submission
    bookingForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      successMsg.style.display = "none";
      errorMsg.style.display = "none";

      const clientName = document.getElementById("clientName").value.trim();
      const service = document.getElementById("service").value;
      const datetime = document.getElementById("datetime").value;

      if (!barberId || !clientName || !service || !datetime) {
        errorMsg.style.display = "block";
        errorMsg.textContent = "❌ Please fill in all fields.";
        return;
      }

      try {
        await push(ref(db, "users/" + barberId + "/appointments"), {
          clientName,
          service,
          date: datetime,
          createdAt: new Date().toISOString()
        });
        successMsg.style.display = "block";
        bookingForm.reset();
      } catch (err) {
        console.error(err);
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
