<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment | Shear Time</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <img src="shear-time-logo.png" alt="Logo" class="header-logo" />
    <h1 class="header-title">Shear Time</h1>
  </header>

  <div class="container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" />
    <h2 id="barberName">Shear Time Barber</h2>
    <p>Book your appointment below</p>

    <form id="bookingForm">
      <label for="clientName">Your Name</label>
      <input type="text" id="clientName" placeholder="Enter your name" required />

      <label for="service">Select Service</label>
      <select id="service" required>
        <option value="">Loading services...</option>
      </select>

      <label for="date">Choose Date</label>
      <input type="date" id="date" required min="" />

      <label for="time">Choose Time</label>
      <select id="time" required>
        <option value="">Select Time</option>
      </select>

      <button type="submit">Book Appointment</button>
    </form>

    <div class="success" id="successMsg">✅ Appointment booked successfully!</div>
    <div class="error" id="errorMsg">❌ Something went wrong. Please try again.</div>
  </div>

  <!-- ✅ Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      databaseURL: "https://shear-time-portal-default-rtdb.firebaseio.com/",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "65107230915",
      appId: "1:65107230915:web:4cdcd3b070744c22ef1ba76"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const barberId = urlParams.get("barber");

    const barberNameEl = document.getElementById("barberName");
    const serviceSelect = document.getElementById("service");
    const bookingForm = document.getElementById("bookingForm");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");
    const dateInput = document.getElementById("date");
    const timeSelect = document.getElementById("time");

    // --- Date + Time Picker Setup ---
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;

    // Generate 30-minute time slots between 9 AM and 6 PM
    for (let hour = 9; hour <= 18; hour++) {
      const hourLabel = hour > 12 ? hour - 12 : hour;
      const ampm = hour >= 12 ? "PM" : "AM";
      const slot1 = `${hourLabel.toString().padStart(2,"0")}:00 ${ampm}`;
      const slot2 = `${hourLabel.toString().padStart(2,"0")}:30 ${ampm}`;
      if (hour < 18) {
        [slot1, slot2].forEach((slot) => {
          const opt = document.createElement("option");
          opt.value = slot;
          opt.textContent = slot;
          timeSelect.appendChild(opt);
        });
      } else {
        const opt = document.createElement("option");
        opt.value = slot1;
        opt.textContent = slot1;
        timeSelect.appendChild(opt);
      }
    }

    if (!barberId) {
      barberNameEl.textContent = "Invalid Barber Link";
      bookingForm.style.display = "none";
    } else {
      const dbRef = ref(db);
      // Load barber name + shop
      get(child(dbRef, "users/" + barberId + "/profile")).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          barberNameEl.textContent = data.name
            ? `${data.name} @ ${data.shopName || "Shear Time"}`
            : "Shear Time Barber";
        }
      });

      // Load available services
      get(child(dbRef, "users/" + barberId + "/services")).then((snapshot) => {
        serviceSelect.innerHTML = "";
        if (snapshot.exists()) {
          const services = snapshot.val();
          Object.values(services).forEach((s) => {
            const option = document.createElement("option");
            option.value = s.name;
            option.textContent = `${s.name} - $${s.price}`;
            serviceSelect.appendChild(option);
          });
        } else {
          serviceSelect.innerHTML = "<option value=''>No services available yet</option>";
        }
      });
    }

    bookingForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      successMsg.style.display = "none";
      errorMsg.style.display = "none";

      const clientName = document.getElementById("clientName").value.trim();
      const service = document.getElementById("service").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const datetime = `${date} ${time}`;

      if (!barberId || !clientName || !service || !datetime) {
        errorMsg.style.display = "block";
        errorMsg.textContent = "❌ Please fill in all fields.";
        return;
      }

      try {
        await push(ref(db, "users/" + barberId + "/appointments"), {
          clientName,
          service,
          date: datetime,
          createdAt: new Date().toISOString()
        });
        successMsg.style.display = "block";
        bookingForm.reset();
      } catch (err) {
        console.error(err);
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
