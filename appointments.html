
   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments | Shear Time Barber</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #111 0%, #000 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
      width: 95%;
      max-width: 420px;
      padding: 25px;
      text-align: center;
    }

    .logo {
      width: 85px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 8px 0 15px;
      font-weight: 600;
      color: #fff;
    }

    .btn {
      background: #e74c3c;
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 10px 16px;
      font-size: 0.95rem;
      margin: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #ff6150;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.15);
    }

    input,
    select {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 6px;
      margin: 4px;
    }

    input[type="time"],
    input[type="date"] {
      width: 42%;
    }

    .calendar,
    .time-slots {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      text-align: left;
    }

    .time-slot {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      color: #ddd;
    }

    footer {
      margin-top: 25px;
      color: #888;
      font-size: 0.8rem;
    }

    .dashboard-btn {
      margin-top: 14px;
      background: #e74c3c;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }

    .dashboard-btn:hover {
      background: #ff5e4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" class="logo" />
    <h2>Appointments</h2>

    <div>
      <input type="date" id="blockDate" />
      <input type="time" id="blockStart" />
      <input type="time" id="blockEnd" />
      <button id="blockBtn" class="btn secondary">Block Time</button>
    </div>

    <div>
      <input type="time" id="startHour" value="09:00" />
      <input type="time" id="endHour" value="18:00" />
      <button id="saveHoursBtn" class="btn">Save Working Hours</button>
    </div>

    <div class="time-slots">
      <p><strong>Today's Appointments</strong></p>
      <div id="appointmentsList">
        <div class="time-slot">Loading appointments...</div>
      </div>
    </div>

    <button class="dashboard-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
  </div>

  <footer>© 2025 Shear Time | All rights reserved</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      push,
      get,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      databaseURL: "https://shear-time-portal-default-rtdb.firebaseio.com/",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "65107230915",
      appId: "1:65107230915:web:4dcd3b070744c22ef1ba76"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const listContainer = document.getElementById("appointmentsList");
    const saveHoursBtn = document.getElementById("saveHoursBtn");
    const blockBtn = document.getElementById("blockBtn");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const uid = user.uid;

      // 🔹 Load appointments
      const apptRef = ref(db, "appointments/" + uid);
      onValue(apptRef, (snapshot) => {
        listContainer.innerHTML = "";
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach((key) => {
            const appt = data[key];
            const div = document.createElement("div");
            div.className = "time-slot";
            div.textContent = `${appt.date} - ${appt.time} (${appt.clientName}) - ${appt.service}`;
            listContainer.appendChild(div);
          });
        } else {
          listContainer.innerHTML = '<div class="time-slot">No appointments yet.</div>';
        }
      });

      // 🔹 Save working hours
      saveHoursBtn.addEventListener("click", async () => {
        const start = document.getElementById("startHour").value;
        const end = document.getElementById("endHour").value;
        await set(ref(db, "hours/" + uid), { start, end });
        alert("Working hours saved!");
      });

      // 🔹 Block off specific time or day
      blockBtn.addEventListener("click", async () => {
        const date = document.getElementById("blockDate").value;
        const start = document.getElementById("blockStart").value;
        const end = document.getElementById("blockEnd").value;

        if (!date) {
          alert("Please select a date to block.");
          return;
        }

        await push(ref(db, "blocked/" + uid), {
          date,
          start: start || "All Day",
          end: end || "All Day"
        });

        alert("Time blocked off successfully!");
      });
    });
  </script>
</body>
</html>
