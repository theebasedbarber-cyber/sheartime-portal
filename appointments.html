<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Appointments | Shear Time</title>
  <style>
    :root{
      --red:#e74c3c;--red2:#ff6150;
      --bg:#0f0f10;--panel:#19191b;--line:rgba(255,255,255,.12);
      --muted:#bfbfbf;--txt:#fff;
    }
    body{
      margin:0;font-family:Poppins,system-ui,sans-serif;
      background:radial-gradient(circle at top,#111 0%,#000 100%);
      color:var(--txt);display:flex;flex-direction:column;align-items:center;padding:10px;
    }
    header{
      width:100%;max-width:900px;display:flex;justify-content:space-between;
      align-items:center;padding:10px 0;margin-bottom:10px;
    }
    h2{margin:0;}
    button{
      background:var(--red);color:#fff;border:none;border-radius:8px;
      padding:8px 14px;font-weight:600;cursor:pointer;
    }
    button:hover{background:var(--red2);}
    .ghost{background:rgba(255,255,255,.12);}
    .container{
      width:100%;max-width:900px;background:var(--panel);
      border:1px solid var(--line);border-radius:14px;
      box-shadow:0 0 28px rgba(255,0,0,.25);padding:10px;
    }
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px;}
    .day{
      border:1px solid var(--line);min-height:120px;padding:6px;font-size:.9rem;
      position:relative;border-radius:6px;overflow:hidden;
    }
    .slot{padding:3px 6px;border-radius:4px;margin-top:4px;font-size:.8rem;}
    .booked{background:var(--red);color:#fff;}
    .blocked{background:#444;color:#fff;}
    .open{background:#004d40;color:#fff;}
    .list-view{display:none;margin-top:10px;}
    .item{border-bottom:1px solid var(--line);padding:8px 4px;}
    .muted{color:var(--muted);font-size:.9rem;}
    .toggle{margin-left:10px;}
  </style>
</head>
<body>
  <header>
    <h2>Appointments</h2>
    <div>
      <button id="hoursBtn">🕒 Manage Hours</button>
      <button id="toggleView" class="ghost toggle">📋 List View</button>
    </div>
  </header>

  <div class="container">
    <div id="calendar" class="calendar"></div>
    <div id="listView" class="list-view"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth,onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import {
      getFirestore,collection,getDocs,doc,getDoc,query,orderBy
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig={
      apiKey:"AIzaSyATJ7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
      authDomain:"shear-time-86b38.firebaseapp.com",
      projectId:"shear-time-86b38",
      storageBucket:"shear-time-86b38.firebasestorage.app",
      messagingSenderId:"335604759855",
      appId:"1:335604759855:web:03ea774f849224e63575da"
    };
    const app=initializeApp(firebaseConfig);
    const auth=getAuth(app);
    const db=getFirestore(app);

    const calendar=document.getElementById("calendar");
    const listView=document.getElementById("listView");
    const toggleView=document.getElementById("toggleView");
    const hoursBtn=document.getElementById("hoursBtn");

    hoursBtn.onclick=()=>window.location.href='availability.html';

    let uid=null;let view="calendar";

    toggleView.onclick=()=>{
      view=view==="calendar"?"list":"calendar";
      calendar.style.display=view==="calendar"?"grid":"none";
      listView.style.display=view==="list"?"block":"none";
      toggleView.textContent=view==="calendar"?"📋 List View":"🗓 Calendar View";
    };

    onAuthStateChanged(auth,async user=>{
      if(!user){window.location='login.html';return;}
      uid=user.uid;
      await loadSchedule();
    });

    async function loadSchedule(){
      const availRef=doc(db,'appointments',uid,'availability','default');
      const availSnap=await getDoc(availRef);
      const defaultStart=availSnap.exists()?availSnap.data().start:'08:00';
      const defaultEnd=availSnap.exists()?availSnap.data().end:'20:00';

      const bookedSnap=await getDocs(collection(db,'appointments',uid,'clientAppointments'));
      const blockedSnap=await getDocs(query(collection(db,'appointments',uid,'blockedTimes'),orderBy('date')));
      const today=new Date();
      const startWeek=new Date(today);startWeek.setDate(today.getDate()-today.getDay());
      const days=[];
      for(let i=0;i<7;i++){const d=new Date(startWeek);d.setDate(startWeek.getDate()+i);days.push(d);}
      calendar.innerHTML='';
      for(const day of days){
        const el=document.createElement('div');
        el.className='day';
        const dateStr=day.toISOString().split('T')[0];
        el.innerHTML=`<strong>${day.toLocaleDateString(undefined,{weekday:'short'})}</strong><br>${day.getMonth()+1}/${day.getDate()}`;
        const booked=bookedSnap.docs.filter(d=>d.data().date===dateStr);
        const blocked=blockedSnap.docs.filter(d=>d.data().date===dateStr);
        if(blocked.length>0){
          blocked.forEach(b=>{
            const blk=document.createElement('div');
            blk.className='slot blocked';
            blk.textContent=`Blocked ${b.data().start||''}-${b.data().end||''}`;
            el.appendChild(blk);
          });
        }else if(booked.length>0){
          booked.forEach(b=>{
            const bd=b.data();
            const div=document.createElement('div');
            div.className='slot booked';
            div.textContent=`${bd.time||''} ${bd.name||'Client'} (${bd.service||''})`;
            el.appendChild(div);
          });
        }else{
          const div=document.createElement('div');
          div.className='slot open';
          div.textContent=`Open ${defaultStart}-${defaultEnd}`;
          el.appendChild(div);
        }
        calendar.appendChild(el);
      }

      // List view
      listView.innerHTML='';
      const listItems=bookedSnap.docs.map(d=>{
        const bd=d.data();
        return `<div class="item"><strong>${bd.date}</strong> - ${bd.time||''} | ${bd.name||'Client'} - ${bd.service||''}</div>`;
      });
      if(listItems.length===0) listView.innerHTML='<p class="muted">No appointments booked.</p>';
      else listView.innerHTML=listItems.join('');
    }
  </script>
</body>
</html>
