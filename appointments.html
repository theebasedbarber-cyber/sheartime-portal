<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointments | Shear Time</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Page-specific styles --- */
    .month-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .month-btn{width:auto;padding:8px 10px}
    .cal{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
    .cal th{background:#7a1a1a;color:#fff;padding:10px;font-weight:600;text-align:center}
    .cal td{height:46px;background:#fff;text-align:right;padding:8px 10px;border:1px solid #eee;position:relative;vertical-align:top;cursor:pointer}
    .cal td.past{color:#9aa0a6;background:#fafafa}
    .cal td.today{outline:2px solid #b22222;outline-offset:-2px;font-weight:700}
    .cal td.has-items::after{content:"";width:6px;height:6px;border-radius:999px;background:#b22222;position:absolute;left:8px;bottom:8px}
    .cal td.has-block::before{content:"";width:10px;height:3px;border-radius:2px;background:#9aa0a6;position:absolute;left:6px;top:6px}
    .cal td.full-off{background:#e9ecef !important}
    .cal td.full-off .off-badge{position:absolute;left:6px;bottom:6px;background:#adb5bd;color:#fff;font-size:.65em;border-radius:4px;padding:1px 4px}
    .legend{display:flex;gap:10px;justify-content:center;margin:12px 0 6px}
    .legend span{display:flex;align-items:center;gap:6px;font-size:.85em;color:#666}
    .dot{width:8px;height:8px;border-radius:50%;background:#b22222;display:inline-block}
    .bar{width:14px;height:4px;border-radius:2px;background:#9aa0a6;display:inline-block}

    /* Timeline */
    .day-header{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
    .hours-card{border:1px solid #eee;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .slot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #f0f0f0}
    .slot:first-child{border-top:none}
    .slot-time{width:92px;flex:0 0 92px;color:#666;font-weight:600}
    .slot-body{flex:1}
    .slot.open{background:#fff;cursor:pointer}
    .slot.open:hover{background:#fafafa}
    .pill{display:inline-block;padding:6px 10px;border-radius:8px;font-size:.92em}
    .pill-appt{background:#ffeaea;border:1px solid #f4b5b5;color:#8b0000}
    .pill-block{background:#eef1f3;border:1px solid #d5dbe0;color:#333}

    .btn-row{display:flex;gap:10px;margin-top:10px}
    .btn-row .btn{flex:1}

    /* modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
    .modal{width:92%;max-width:380px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.25)}
    .modal h3{margin:0 0 8px}
    .modal .row{display:flex;gap:8px}
    .modal .row > *{flex:1}
    .preset-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .preset-row button{background:#e9ecef;color:#333}
    .preset-row button:hover{background:#dfe4ea}

    .wh-card{border:1px solid #eee;background:#fff;border-radius:10px;padding:10px;margin-top:12px}
    .wh-row{display:flex;gap:8px}
    .wh-row select{width:100%}
  </style>
</head>
<body>
  <header class="app-header">
    <img src="shear-time-logo.png" alt="Logo" class="header-logo" />
    Shear Time
  </header>

  <div class="container" id="app">
    <img src="shear-time-logo.png" alt="Shear Time Logo" style="width:64px;margin-bottom:4px" />
    <h2 style="margin:6px 0 12px">Appointments</h2>

    <div class="month-bar">
      <button class="btn month-btn" id="prevMonth">◀</button>
      <div id="monthTitle" style="font-weight:700"></div>
      <button class="btn month-btn" id="nextMonth">▶</button>
    </div>

    <table class="cal">
      <thead>
        <tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>
      </thead>
      <tbody id="calBody"></tbody>
    </table>

    <div class="legend">
      <span><span class="dot"></span> appointment</span>
      <span><span class="bar"></span> blocked</span>
      <span>red outline = today</span>
    </div>

    <div class="btn-row">
      <button class="btn" id="addAppt">+ Add Appointment</button>
      <button class="btn" id="openBlock">Block Time</button>
    </div>

    <!-- Working hours -->
    <div class="wh-card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <strong>Working Hours</strong>
        <button class="btn" id="saveHours" style="width:auto;padding:8px 10px">Save</button>
      </div>
      <div class="wh-row" style="margin-top:8px">
        <div>
          <label for="startHour" style="margin:0;font-weight:600">Start</label>
          <select id="startHour"></select>
        </div>
        <div>
          <label for="endHour" style="margin:0;font-weight:600">End</label>
          <select id="endHour"></select>
        </div>
      </div>
      <div class="muted" id="hoursHint" style="margin-top:6px"></div>
    </div>

    <!-- Day/timeline header -->
    <div class="day-header">
      <h3 id="listTitle" style="margin:16px 0 8px">Day View</h3>
      <button class="btn" onclick="window.location.href='dashboard.html'" style="width:auto;padding:8px 10px">Dashboard</button>
    </div>

    <!-- Hourly timeline (30-min slots) -->
    <div class="hours-card" id="timeline"></div>
  </div>

  <!-- Block time modal -->
  <div class="modal-backdrop" id="blockModal">
    <div class="modal">
      <h3>Block Availability</h3>
      <label for="blkDate">Date</label>
      <input type="date" id="blkDate" required />
      <div class="row">
        <div>
          <label for="blkTime">Start</label>
          <select id="blkTime"></select>
        </div>
        <div>
          <label for="blkDur">Duration</label>
          <select id="blkDur">
            <option value="30">30 min</option>
            <option value="60" selected>60 min</option>
            <option value="90">90 min</option>
            <option value="120">120 min</option>
          </select>
        </div>
      </div>

      <div style="margin-top:8px" class="muted">Presets</div>
      <div class="preset-row">
        <button class="btn" type="button" id="presetMorning">Morning (8–12)</button>
        <button class="btn" type="button" id="presetAfternoon">Afternoon (12–5)</button>
        <button class="btn" type="button" id="presetEvening">Evening (5–9)</button>
        <button class="btn" type="button" id="presetFull">Full Day Off</button>
      </div>

      <div class="btn-row" style="margin-top:12px">
        <button class="btn" id="saveBlock">Save Block</button>
        <button class="btn" id="cancelBlock" style="background:#666">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getDatabase, ref, onValue, get, set, push, child, remove } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      databaseURL: "https://shear-time-portal-default-rtdb.firebaseio.com/",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "65107230915",
      appId: "1:65107230915:web:4cdcd3b070744c22ef1ba76"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // UI refs
    const monthTitle = document.getElementById("monthTitle");
    const calBody = document.getElementById("calBody");
    const addApptBtn = document.getElementById("addAppt");
    const prevBtn = document.getElementById("prevMonth");
    const nextBtn = document.getElementById("nextMonth");
    const listTitle = document.getElementById("listTitle");
    const timeline = document.getElementById("timeline");

    const blockModal = document.getElementById("blockModal");
    const openBlockBtn = document.getElementById("openBlock");
    const cancelBlock = document.getElementById("cancelBlock");
    const blkDate = document.getElementById("blkDate");
    const blkTime = document.getElementById("blkTime");
    const blkDur = document.getElementById("blkDur");
    const saveBlock = document.getElementById("saveBlock");
    const presetMorning = document.getElementById("presetMorning");
    const presetAfternoon = document.getElementById("presetAfternoon");
    const presetEvening = document.getElementById("presetEvening");
    const presetFull = document.getElementById("presetFull");

    const startHourSel = document.getElementById("startHour");
    const endHourSel   = document.getElementById("endHour");
    const saveHoursBtn = document.getElementById("saveHours");
    const hoursHint    = document.getElementById("hoursHint");

    // State
    let uid = null;
    let current = new Date();
    let selectedDate = new Date();

    let appts = {};      // id -> {clientName, service, date}
    let blocks = {};     // id -> {type, startISO, endISO}
    let apptsByDay = {}; // YYYY-MM-DD -> [ids]
    let blocksByDay = {}; // YYYY-MM-DD -> [ids]

    const APPT_SLOT_MIN = 30; // assumed appointment slot length for timeline

    function pad(n){ return n.toString().padStart(2,"0"); }
    function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    function toMinutes(hhmm){ const [H,M] = hhmm.split(":").map(Number); return H*60+M; }

    function parseLegacyDate(str){
      // supports "YYYY-MM-DD HH:MM AM/PM" or ISO
      if(!str) return null;
      if(str.includes("AM") || str.includes("PM")){
        const parts = str.split(" ");
        const [yyyy, mm, dd] = parts[0].split("-").map(Number);
        let [hh, mi] = parts[1].split(":").map(Number);
        const ampm = parts[2];
        if (ampm === "PM" && hh !== 12) hh += 12;
        if (ampm === "AM" && hh === 12) hh = 0;
        return new Date(yyyy, mm-1, dd, hh, mi);
      }
      return new Date(str);
    }

    function fmtHuman(d){
      return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    }

    // Build selects
    function buildTimeList(select){
      select.innerHTML = "";
      for(let h=6; h<=21; h++){
        for(let m of [0,30]){
          const d = new Date(2000,0,1,h,m);
          const label = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
          const opt = document.createElement("option");
          opt.value = `${pad(h)}:${pad(m)}`;
          opt.textContent = label;
          select.appendChild(opt);
        }
      }
    }
    function buildHourSelects(){
      startHourSel.innerHTML = ""; endHourSel.innerHTML = "";
      for(let h=5; h<=22; h++){
        const d = new Date(2000,0,1,h,0);
        const label = d.toLocaleTimeString([], {hour:"numeric"});
        const o1 = document.createElement("option");
        o1.value = h; o1.textContent = label; startHourSel.appendChild(o1);
        const o2 = document.createElement("option");
        o2.value = h; o2.textContent = label; endHourSel.appendChild(o2);
      }
    }
    buildTimeList(blkTime);
    buildHourSelects();

    function resetMaps(){
      apptsByDay = {};
      blocksByDay = {};
      Object.keys(appts).forEach(id=>{
        const item = appts[id];
        const when = parseLegacyDate(item.date || item.when);
        if(!when || isNaN(when)) return;
        const key = ymd(when);
        (apptsByDay[key] ||= []).push(id);
      });
      Object.keys(blocks).forEach(id=>{
        const b = blocks[id];
        const start = new Date(b.startISO);
        const key = ymd(start);
        (blocksByDay[key] ||= []).push(id);
      });
    }

    function isFullDayBlock(b){
      const s = new Date(b.startISO), e = new Date(b.endISO);
      return s.getHours()===0 && s.getMinutes()===0 && (e.getHours()>=23) && e.getMinutes()>=59;
    }

    function renderCalendar(){
      const y = current.getFullYear(), m = current.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m+1, 0);
      const today = new Date();
      monthTitle.textContent = `${first.toLocaleString('default', {month:'long'})} ${y}`;
      calBody.innerHTML = "";

      let row = document.createElement("tr");
      for(let i=0;i<first.getDay();i++) row.appendChild(document.createElement("td"));

      for(let d=1; d<=last.getDate(); d++){
        const cell = document.createElement("td");
        const dateObj = new Date(y, m, d);
        const key = ymd(dateObj);
        cell.textContent = d;

        if(dateObj.toDateString() === today.toDateString()) cell.classList.add("today");
        if(dateObj < new Date(today.getFullYear(), today.getMonth(), today.getDate())) cell.classList.add("past");

        if((apptsByDay[key]||[]).length) cell.classList.add("has-items");
        const dayBlocks = (blocksByDay[key]||[]).map(id=>blocks[id]);
        if(dayBlocks.length) cell.classList.add("has-block");
        if(dayBlocks.some(isFullDayBlock)){
          cell.classList.add("full-off");
          const badge = document.createElement("div");
          badge.className = "off-badge";
          badge.textContent = "OFF";
          cell.appendChild(badge);
        }

        cell.addEventListener("click", ()=>{
          selectedDate = dateObj;
          renderTimeline();
        });

        row.appendChild(cell);
        if((first.getDay()+d) % 7 === 0){
          calBody.appendChild(row);
          row = document.createElement("tr");
        }
      }
      if(row.children.length){
        while(row.children.length<7) row.appendChild(document.createElement("td"));
        calBody.appendChild(row);
      }
    }

    function minutesSinceMidnight(d){
      return d.getHours()*60 + d.getMinutes();
    }

    function slotLabels(startHour, endHour){
      const labels = [];
      for(let h=startHour; h<endHour; h++){
        for(const m of [0,30]){
          const d = new Date(2000,0,1,h,m);
          labels.push(d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})); // "9:30 AM"
        }
      }
      // include endHour :00
      const end = new Date(2000,0,1,endHour,0);
      labels.push(end.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}));
      return labels;
    }

    function renderTimeline(){
      const key = ymd(selectedDate);
      const dayApptIds = apptsByDay[key] || [];
      const dayBlockIds = blocksByDay[key] || [];

      // load working hours from profile (already fetched into selects)
      const startH = parseInt(startHourSel.value, 10) || 8;
      const endH   = parseInt(endHourSel.value, 10) || 20;
      hoursHint.textContent = `Showing ${new Date(2000,0,1,startH,0).toLocaleTimeString([], {hour:"numeric"})} – ${new Date(2000,0,1,endH,0).toLocaleTimeString([], {hour:"numeric"})}`;

      listTitle.textContent = new Intl.DateTimeFormat(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'}).format(selectedDate);

      // Prepare blocked ranges for this day
      const ranges = dayBlockIds.map(id => {
        const b = blocks[id];
        const s = new Date(b.startISO);
        const e = new Date(b.endISO);
        return { b, s, e };
      });

      // Prepare appointments at 30-min resolution (assume APPT_SLOT_MIN)
      const apptMap = {}; // "HH:MM" 24h -> item
      dayApptIds.forEach(id=>{
        const it = appts[id];
        const dt = parseLegacyDate(it.date);
        if(!dt) return;
        const hhmm = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
        apptMap[hhmm] = { id, it, dt };
      });

      // Build slots
      const labels = slotLabels(startH, endH);
      timeline.innerHTML = "";
      labels.forEach(label=>{
        // convert label to 24h "HH:MM"
        const probe = new Date(`2000-01-01 ${label}`);
        const hhmm = `${pad(probe.getHours())}:${pad(probe.getMinutes())}`;

        // anchor to selected date
        const slotStart = new Date(`${key}T${hhmm}:00`);
        const slotEnd   = new Date(slotStart.getTime() + 30*60000);

        // check blocked overlap
        const blocking = ranges.find(r => slotStart < r.e && slotEnd > r.s);

        // check appointment
        const appt = apptMap[hhmm];

        const row = document.createElement("div");
        row.className = "slot" + (!blocking && !appt ? " open" : "");
        const timeCol = document.createElement("div");
        timeCol.className = "slot-time";
        timeCol.textContent = label;
        const body = document.createElement("div");
        body.className = "slot-body";

        if (appt){
          const pill = document.createElement("span");
          pill.className = "pill pill-appt";
          pill.textContent = `${appt.it.clientName || 'Client'} — ${appt.it.service || ''} @ ${label}`;
          body.appendChild(pill);

          // delete button
          const del = document.createElement("button");
          del.className = "btn";
          del.style.width = "auto"; del.style.padding = "6px 10px"; del.style.marginLeft = "8px";
          del.textContent = "Delete";
          del.addEventListener("click", async (e)=>{
            e.stopPropagation();
            if(confirm("Delete this appointment?")){
              await remove(ref(db, `users/${uid}/appointments/${appt.id}`));
            }
          });
          body.appendChild(del);
        } else if (blocking){
          const pill = document.createElement("span");
          pill.className = "pill pill-block";
          const labelTxt = (blocking.b.type==="full") ? "Full Day Off" :
            `${blocking.s.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})} – ${blocking.e.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`;
          pill.textContent = `Blocked • ${labelTxt}`;
          body.appendChild(pill);

          const del = document.createElement("button");
          del.className = "btn";
          del.style.width = "auto"; del.style.padding = "6px 10px"; del.style.marginLeft = "8px";
          del.textContent = "Remove";
          del.addEventListener("click", async (e)=>{
            e.stopPropagation();
            // find the exact block id (by strict match)
            const blockId = (blocksByDay[key]||[]).find(id=>{
              const b = blocks[id];
              return new Date(b.startISO).getTime() === blocking.s.getTime() && new Date(b.endISO).getTime() === blocking.e.getTime();
            }) || (dayBlockIds[0] || null);
            if(blockId && confirm("Remove this blocked time?")){
              await remove(ref(db, `users/${uid}/blockedTimes/${blockId}`));
            }
          });
          body.appendChild(del);
        } else {
          body.textContent = "Available — tap to book";
          row.addEventListener("click", ()=>{
            const human = probe.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
            window.location.href = `book.html?barber=${encodeURIComponent(uid)}&date=${encodeURIComponent(key)}&time=${encodeURIComponent(human)}`;
          });
        }

        row.appendChild(timeCol);
        row.appendChild(body);
        timeline.appendChild(row);
      });
    }

    function rebuildAll(){
      // Calendar indicators need grouped maps
      apptsByDay = {}; blocksByDay = {};
      Object.keys(appts).forEach(id=>{
        const d = parseLegacyDate(appts[id].date);
        if(!d) return;
        const k = ymd(d);
        (apptsByDay[k] ||= []).push(id);
      });
      Object.keys(blocks).forEach(id=>{
        const s = new Date(blocks[id].startISO);
        const k = ymd(s);
        (blocksByDay[k] ||= []).push(id);
      });

      renderCalendar();
      renderTimeline();
    }

    // Subscriptions
    function liveSubscribe(){
      onValue(ref(db, `users/${uid}/appointments`), (snap)=>{
        appts = {};
        if(snap.exists()){
          const v = snap.val();
          for(const id in v) appts[id] = v[id];
        }
        rebuildAll();
      });
      onValue(ref(db, `users/${uid}/blockedTimes`), (snap)=>{
        blocks = {};
        if(snap.exists()){
          const v = snap.val();
          for(const id in v) blocks[id] = v[id];
        }
        rebuildAll();
      });
      onValue(ref(db, `users/${uid}/profile`), (snap)=>{
        // working hours
        let startH = 8, endH = 20;
        if(snap.exists()){
          const p = snap.val();
          if(Number.isInteger(p.startHour)) startH = p.startHour;
          if(Number.isInteger(p.endHour))   endH = p.endHour;
        }
        startHourSel.value = startH;
        endHourSel.value = endH;
        renderTimeline();
      });
    }

    // Month nav
    prevBtn.addEventListener("click", ()=>{ current.setMonth(current.getMonth()-1); renderCalendar(); });
    nextBtn.addEventListener("click", ()=>{ current.setMonth(current.getMonth()+1); renderCalendar(); });

    // Working hours save
    saveHoursBtn.addEventListener("click", async ()=>{
      const s = parseInt(startHourSel.value,10);
      const e = parseInt(endHourSel.value,10);
      if(!(s>=0 && e>0 && e>s)){ alert("Please pick valid hours (end after start)."); return; }
      await set(ref(db, `users/${uid}/profile/startHour`), s);
      await set(ref(db, `users/${uid}/profile/endHour`), e);
      renderTimeline();
      alert("Working hours saved.");
    });

    // Add appointment → booking link
    addApptBtn.addEventListener("click", ()=>{
      if(!uid) return;
      const key = ymd(selectedDate);
      window.location.href = `book.html?barber=${encodeURIComponent(uid)}&date=${encodeURIComponent(key)}`;
    });

    // Block modal
    function openModal(){
      const today = new Date();
      blkDate.value = ymd(selectedDate || today);
      blockModal.style.display = "flex";
    }
    function closeModal(){ blockModal.style.display = "none"; }
    openBlockBtn.addEventListener("click", openModal);
    cancelBlock.addEventListener("click", closeModal);

    async function saveBlockType(typeOverride=null){
      const date = blkDate.value;
      if(!date){ alert("Pick a date"); return; }

      let start, end, type="custom";
      if(typeOverride === "full"){
        start = new Date(`${date}T00:00:00`);
        end   = new Date(`${date}T23:59:59`);
        type = "full";
      } else if(typeOverride === "morning"){
        start = new Date(`${date}T08:00:00`);
        end   = new Date(`${date}T12:00:00`);
        type = "morning";
      } else if(typeOverride === "afternoon"){
        start = new Date(`${date}T12:00:00`);
        end   = new Date(`${date}T17:00:00`);
        type = "afternoon";
      } else if(typeOverride === "evening"){
        start = new Date(`${date}T17:00:00`);
        end   = new Date(`${date}T21:00:00`);
        type = "evening";
      } else {
        const [H,M] = (blkTime.value || "09:00").split(":").map(Number);
        const dur = parseInt(blkDur.value,10) || 60;
        start = new Date(`${date}T${pad(H)}:${pad(M)}:00`);
        end = new Date(start.getTime() + dur*60000);
        type = "custom";
      }

      await push(ref(db, `users/${uid}/blockedTimes`), {
        type, startISO: start.toISOString(), endISO: end.toISOString(),
        createdAt: new Date().toISOString()
      });
    }

    saveBlock.addEventListener("click", async ()=>{
      try{ await saveBlockType(); closeModal(); } catch(e){ alert("Couldn't save block."); }
    });
    presetMorning.addEventListener("click", async ()=>{ try{ await saveBlockType("morning"); closeModal(); }catch(e){ alert("Error"); }});
    presetAfternoon.addEventListener("click", async ()=>{ try{ await saveBlockType("afternoon"); closeModal(); }catch(e){ alert("Error"); }});
    presetEvening.addEventListener("click", async ()=>{ try{ await saveBlockType("evening"); closeModal(); }catch(e){ alert("Error"); }});
    presetFull.addEventListener("click", async ()=>{ try{ await saveBlockType("full"); closeModal(); }catch(e){ alert("Error"); }});

    // Auth + init
    onAuthStateChanged(auth, (user)=>{
      if(!user){ window.location.href = "login.html"; return; }
      uid = user.uid;
      selectedDate = new Date();
      liveSubscribe();
    });
  </script>
</body>
</html>
