<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time Barber Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" class="logo" />
    <h2>Shear Time Barber Dashboard</h2>

    <div id="barberInfo" class="info-box">
      <h3>Barber</h3>
      <p id="barberEmail">Loading...</p>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <div id="linkBox" class="info-box">
      <h3>My Booking Link</h3>
      <input type="text" id="bookingLink" readonly />
      <div class="button-row">
        <button id="copyLink">Copy Link</button>
        <button id="shareLink">Share Link</button>
        <button id="qrLink">QR Code</button>
      </div>
    </div>

    <div class="button-row">
      <button onclick="window.location.href='appointments.html'">Appointments</button>
      <button onclick="window.location.href='services.html'">Services</button>
      <button onclick="window.location.href='payments.html'">Payments</button>
      <button onclick="window.location.href='settings.html'">Settings</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAT7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
      authDomain: "shear-time-86b38.firebaseapp.com",
      projectId: "shear-time-86b38",
      storageBucket: "shear-time-86b38.firebasestorage.app",
      messagingSenderId: "335604759855",
      appId: "1:335604759855:web:03ea774f849224e63575da"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Ensure persistence so session stays after refresh
    await setPersistence(auth, browserLocalPersistence);

    const logoutBtn = document.getElementById("logoutBtn");
    const bookingLinkInput = document.getElementById("bookingLink");

    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });

    onAuthStateChanged(auth, (user) => {
      const emailField = document.getElementById("barberEmail");

      if (user) {
        // ✅ Logged in
        emailField.textContent = user.email;
        const uid = user.uid;
        const publicLink = `${location.origin}/book-public.html?barber=${encodeURIComponent(uid)}`;
        bookingLinkInput.value = publicLink;
      } else {
        // ⏳ Wait a moment before redirecting to avoid false negatives
        setTimeout(() => {
          if (!auth.currentUser) {
            window.location.href = "login.html";
          }
        }, 1200);
      }
    });

    // Copy link
    document.getElementById("copyLink").addEventListener("click", () => {
      bookingLinkInput.select();
      document.execCommand("copy");
      alert("Booking link copied!");
    });

    // Share link (for mobile)
    document.getElementById("shareLink").addEventListener("click", async () => {
      const link = bookingLinkInput.value;
      if (navigator.share) {
        await navigator.share({ title: "Book an Appointment", url: link });
      } else {
        alert("Sharing not supported on this device.");
      }
    });

    // Placeholder for QR
    document.getElementById("qrLink").addEventListener("click", () => {
      alert("QR code feature coming soon!");
    });
  </script>
</body>
</html>
