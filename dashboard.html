<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Shear Time</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <img src="shear-time-logo.png" alt="Logo" class="header-logo" />
    Shear Time
  </header>

  <!-- Main Container -->
  <div class="container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" width="80" />
    <h2 id="welcomeText">Welcome to Your Dashboard</h2>
    <p id="userEmail"></p>

    <!-- Buttons -->
    <button class="btn" onclick="goTo('book.html')">Appointments</button>
    <button class="btn" onclick="goTo('clients.html')">Clients</button>
    <button class="btn" onclick="goTo('services.html')">Services</button>
    <button class="btn" onclick="goTo('payments.html')">Payments</button>
    <button class="btn" onclick="goTo('settings.html')">Settings</button>

    <button id="logoutBtn" class="btn" style="background-color:#555;">Logout</button>
  </div>

  <!-- Firebase + Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      databaseURL: "https://shear-time-portal-default-rtdb.firebaseio.com/",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "65107230915",
      appId: "1:65107230915:web:4cdcd3b070744c22ef1ba76"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userEmail = document.getElementById("userEmail");

    // Redirect if not logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.textContent = `Logged in as: ${user.email}`;
      } else {
        window.location.href = "login.html";
      }
    });

    // Logout function
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    // Page navigation
    window.goTo = (page) => {
      window.location.href = page;
    };
  </script>
</body>
</html>
