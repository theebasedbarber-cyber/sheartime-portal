<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time Barber Dashboard</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #0c0c0c 0%, #181818 100%);
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-top: 40px;
    }

    .dashboard-card {
      background: rgba(30, 30, 30, 0.95);
      border-radius: 20px;
      padding: 30px 35px;
      text-align: center;
      width: 400px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
    }

    .dashboard-card img {
      width: 80px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    h3 {
      font-weight: 400;
      color: #bbb;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .email-display {
      background: #262626;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
      color: #ddd;
      word-wrap: break-word;
    }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .nav-buttons button {
      background-color: #c0392b;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-buttons button:hover {
      background-color: #e74c3c;
    }

    #logoutBtn {
      background-color: #444;
    }

    #logoutBtn:hover {
      background-color: #777;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 0.85rem;
    }

    a {
      color: #ff7066;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="dashboard-card">
    <img src="shear-time-logo.png" alt="Shear Time Logo" />
    <h1>Shear Time Barber Dashboard</h1>
    <h3>Welcome Back</h3>

    <div class="email-display" id="userEmail">Loading...</div>

    <div class="nav-buttons">
      <button onclick="location.href='appointments.html'">Appointments</button>
      <button onclick="location.href='services.html'">Services</button>
      <button onclick="location.href='payments.html'">Payments</button>
      <button onclick="location.href='settings.html'">Settings</button>
    </div>

    <button id="logoutBtn">Logout</button>
  </div>

  <footer>© 2025 Shear Time | All rights reserved</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATJ7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
      authDomain: "shear-time-86b38.firebaseapp.com",
      projectId: "shear-time-86b38",
      storageBucket: "shear-time-86b38.firebasestorage.app",
      messagingSenderId: "335604759855",
      appId: "1:335604759855:web:03ea774f849224e63575da"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Load user info
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("userEmail").innerText = user.email;
      } else {
        window.location.href = "login.html";
      }
    });

    // Logout button
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
