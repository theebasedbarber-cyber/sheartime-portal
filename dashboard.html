<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time Barber Dashboard</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .dashboard-container {
      width: 90%;
      max-width: 380px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 22px;
      text-align: center;
    }

    .logo {
      width: 85px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 12px;
    }

    .info-box {
      background: #fafafa;
      border-radius: 10px;
      padding: 12px;
      margin: 8px 0;
      font-size: 0.95rem;
    }

    .logout-btn {
      background: #b52b2b;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    .logout-btn:hover { background: #8b2020; }

    input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }

    button {
      background: #b52b2b;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      flex: 1 1 45%;
      min-width: 130px;
      font-size: 0.95rem;
    }

    button:hover { background: #8b2020; }

    footer {
      font-size: 0.8rem;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="dashboard-container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" class="logo" />
    <h2>Shear Time Barber Dashboard</h2>

    <div id="barberInfo" class="info-box">
      <h3>Barber</h3>
      <p id="barberEmail">Loading...</p>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <div id="linkBox" class="info-box">
      <h3>My Booking Link</h3>
      <input type="text" id="bookingLink" readonly />
      <div class="button-row">
        <button id="copyLink">Copy</button>
        <button id="shareLink">Share</button>
        <button id="qrLink">QR</button>
      </div>
    </div>

    <div class="button-row">
      <button onclick="window.location.href='appointments.html'">Appointments</button>
      <button onclick="window.location.href='services.html'">Services</button>
      <button onclick="window.location.href='payments.html'">Payments</button>
      <button onclick="window.location.href='settings.html'">Settings</button>
    </div>

    <footer>© 2025 Shear Time | All rights reserved</footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAT7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
      authDomain: "shear-time-86b38.firebaseapp.com",
      projectId: "shear-time-86b38",
      storageBucket: "shear-time-86b38.firebasestorage.app",
      messagingSenderId: "335604759855",
      appId: "1:335604759855:web:03ea774f849224e63575da"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Ensure session stays alive
    await setPersistence(auth, browserLocalPersistence);

    const logoutBtn = document.getElementById("logoutBtn");
    const bookingLinkInput = document.getElementById("bookingLink");

    // Logout button
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    // Wait for Firebase to finish restoring the session
    const waitForAuth = (callback) => {
      let tries = 0;
      const interval = setInterval(() => {
        if (auth.currentUser || tries > 10) {
          clearInterval(interval);
          callback(auth.currentUser);
        }
        tries++;
      }, 250);
    };

    waitForAuth((user) => {
      if (user) {
        document.getElementById("barberEmail").textContent = user.email;
        const uid = user.uid;
        const link = `${location.origin}/book-public.html?barber=${encodeURIComponent(uid)}`;
        bookingLinkInput.value = link;
      } else {
        window.location.href = "login.html";
      }
    });

    // Copy booking link
    document.getElementById("copyLink").addEventListener("click", () => {
      bookingLinkInput.select();
      document.execCommand("copy");
      alert("Booking link copied!");
    });

    // Share link
    document.getElementById("shareLink").addEventListener("click", async () => {
      const link = bookingLinkInput.value;
      if (navigator.share) {
        await navigator.share({ title: "Book with Shear Time Barber", url: link });
      } else {
        alert("Sharing not supported.");
      }
    });

    // QR placeholder
    document.getElementById("qrLink").addEventListener("click", () => {
      alert("QR feature coming soon!");
    });
  </script>
</body>
</html>
