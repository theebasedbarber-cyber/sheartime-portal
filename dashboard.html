<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time | Dashboard</title>

  <!-- ✅ Link your main stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="dashboard-container">
    <img src="/shear-time-logo.png" alt="Shear Time Logo" class="logo" />
    <h1>Welcome to Your Dashboard</h1>
    <p id="userEmail">Loading user info...</p>
    <button id="logoutBtn" class="btn">Logout</button>
  </div>

  <!-- ✅ Firebase SDK v12.4.0 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    // 🔥 Your Firebase configuration (same as login.html)
    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "651072030915",
      appId: "1:651072030915:web:4dcd3b870744c22ef1ba76"
    };

    // ✅ Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 👤 Check if user is logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("userEmail").textContent = "Logged in as: " + user.email;
      } else {
        window.location.href = "login.html";
      }
    });

    // 🚪 Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
