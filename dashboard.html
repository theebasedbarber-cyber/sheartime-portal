<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shear Time Barber Dashboard</title>
  <style>
    body {
      background: radial-gradient(circle at top, #0d0d0d, #111);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1b1b1b;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      width: 90px;
      margin-bottom: 15px;
    }
    h2 {
      margin-bottom: 5px;
      color: #ff4444;
    }
    .role {
      font-size: 14px;
      color: #ccc;
    }
    .top-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .link-btn {
      flex: 1 1 45%;
      text-align: center;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s;
    }
    .link-btn:hover {
      background: #d32f2f;
    }
    .booking-section {
      margin-top: 25px;
      background: #222;
      border-radius: 10px;
      padding: 15px;
    }
    .booking-section h3 {
      color: #ff8888;
      margin-bottom: 8px;
    }
    .booking-link {
      color: #4ea3ff;
      font-size: 13px;
      word-wrap: break-word;
      display: block;
      margin: 10px 0;
    }
    button {
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 15px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      margin-top: 8px;
      transition: background 0.3s;
    }
    button:hover {
      background: #d32f2f;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="shear-time-logo.png" class="logo" alt="Shear Time Logo">
    <h2>Shear Time Barber Dashboard</h2>
    <div class="role">Barber</div>
    <p id="userEmail"></p>

    <!-- Buttons on Top -->
    <div class="top-buttons">
      <a href="appointments.html" class="link-btn">Appointments</a>
      <a href="services.html" class="link-btn">Services</a>
      <a href="payments.html" class="link-btn">Payments</a>
      <a href="settings.html" class="link-btn">Settings</a>
    </div>

    <!-- Booking link box -->
    <div class="booking-section">
      <h3>My Booking Link</h3>
      <a id="bookingLink" href="#" target="_blank" class="booking-link"></a>
      <button id="copyLink">Copy Link</button>
    </div>

    <!-- Logout -->
    <button id="logoutBtn">Logout</button>

    <footer>© 2025 Shear Time | All rights reserved</footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

    // 🔥 Firebase Config (same as your current project)
    const firebaseConfig = {
      apiKey: "AIzaSyATJ7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
      authDomain: "shear-time-86b38.firebaseapp.com",
      projectId: "shear-time-86b38",
      storageBucket: "shear-time-86b38.firebasestorage.app",
      messagingSenderId: "335604759855",
      appId: "1:335604759855:web:03ea774f849224e63575da"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userEmail = document.getElementById("userEmail");
    const bookingLink = document.getElementById("bookingLink");
    const copyLink = document.getElementById("copyLink");
    const logoutBtn = document.getElementById("logoutBtn");

    // Listen for login state once
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      // ✅ Logged-in user
      userEmail.textContent = user.email;

      // Create unique booking link
      const barberUID = user.uid;
      const link = `https://sheartime-portal.vercel.app/book-public.html?uid=${barberUID}`;
      bookingLink.textContent = link;
      bookingLink.href = link;

      // Copy link to clipboard
      copyLink.addEventListener("click", () => {
        navigator.clipboard.writeText(link);
        copyLink.textContent = "Copied!";
        setTimeout(() => (copyLink.textContent = "Copy Link"), 2000);
      });
    });

    // Logout button
    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("login.html");
      } catch (error) {
        console.error("Logout error:", error);
      }
    });
  </script>
</body>
</html>
