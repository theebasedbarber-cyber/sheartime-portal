<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shear Time Barber Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="shear-time-logo.png" alt="Shear Time Logo" class="logo">
    <h2>Shear Time Barber Dashboard</h2>
    <p><strong>Barber</strong></p>
    <p id="userEmail"></p>

    <!-- Top Button Grid -->
    <div class="dashboard-buttons top-buttons">
      <button onclick="window.location.href='appointments.html'">Appointments</button>
      <button onclick="window.location.href='services.html'">Services</button>
      <button onclick="window.location.href='payments.html'">Payments</button>
      <button onclick="window.location.href='settings.html'">Settings</button>
    </div>

    <!-- Booking Link Section -->
    <div class="link-box">
      <h3>My Booking Link</h3>
      <a id="bookingLink" href="#" target="_blank"></a>
      <button id="copyLinkBtn">Copy Link</button>
    </div>

    <!-- Logout Button -->
    <button id="logoutBtn" class="btn logout-btn">Logout</button>

    <footer>© 2025 Shear Time | All rights reserved</footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfaTpnZw8kJ7br64AmNdFkgtRIXRWS5JQ",
      authDomain: "shear-time-portal.firebaseapp.com",
      projectId: "shear-time-portal",
      storageBucket: "shear-time-portal.firebasestorage.app",
      messagingSenderId: "65107230915",
      appId: "1:65107230915:web:4dcd3b070744c22ef1ba76"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence);

    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');
    const bookingLink = document.getElementById('bookingLink');
    const copyLinkBtn = document.getElementById('copyLinkBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.textContent = user.email;
        const bookingUrl = `https://sheartime-portal.vercel.app/book-public.html?barber=${user.uid}`;
        bookingLink.href = bookingUrl;
        bookingLink.textContent = bookingUrl;
        copyLinkBtn.onclick = () => navigator.clipboard.writeText(bookingUrl);
      } else {
        window.location.href = "login.html";
      }
    });

    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });
  </script>
</body>
</html>
