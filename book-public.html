<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book with Your Barber | Shear Time</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .logo {
      width: 100px;
      margin-bottom: 10px;
    }
    .container {
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      color: #ff4444;
      margin-bottom: 15px;
      text-align: center;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      outline: none;
      background: #333;
      color: white;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover {
      background: #d32f2f;
    }
    .success {
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <img src="shear-time-logo.png" class="logo" alt="Shear Time Logo">
  <div class="container">
    <h2 id="barberName">Book Your Appointment</h2>
    <form id="bookingForm">
      <input type="text" id="clientName" placeholder="Your Name" required />
      <input type="email" id="clientEmail" placeholder="Your Email" required />
      <input type="tel" id="clientPhone" placeholder="Your Phone Number" required />
      <select id="serviceSelect" required>
        <option value="">Select a Service</option>
      </select>
      <input type="date" id="date" required />
      <input type="time" id="time" required />
      <textarea id="notes" placeholder="Notes (optional)" rows="3"></textarea>
      <button type="submit">Confirm Appointment</button>
    </form>
    <div id="successBox" class="success"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATJ7J9wig1gcQPtc5PgwiU1krP8cs_Tj-M",
      authDomain: "shear-time-86b38.firebaseapp.com",
      projectId: "shear-time-86b38",
      storageBucket: "shear-time-86b38.firebasestorage.app",
      messagingSenderId: "335604759855",
      appId: "1:335604759855:web:03ea774f849224e63575da"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Extract barber UID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const barberUID = urlParams.get("uid");

    if (!barberUID) {
      alert("Invalid booking link.");
      document.getElementById("bookingForm").style.display = "none";
    }

    const barberNameElement = document.getElementById("barberName");
    const serviceSelect = document.getElementById("serviceSelect");

    async function loadBarberData() {
      try {
        // Get barber name
        const barberDoc = await getDoc(doc(db, "barbers", barberUID));
        if (barberDoc.exists()) {
          const data = barberDoc.data();
          barberNameElement.textContent = `Book with ${data.displayName || "Your Barber"}`;
        }

        // Get services
        const servicesSnapshot = await getDocs(collection(db, "barbers", barberUID, "services"));
        servicesSnapshot.forEach(docSnap => {
          const option = document.createElement("option");
          option.value = docSnap.id;
          option.textContent = `${docSnap.data().name} - $${docSnap.data().price}`;
          serviceSelect.appendChild(option);
        });
      } catch (error) {
        console.error("Error loading barber data:", error);
      }
    }
    loadBarberData();

    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const clientName = document.getElementById("clientName").value.trim();
      const clientEmail = document.getElementById("clientEmail").value.trim();
      const clientPhone = document.getElementById("clientPhone").value.trim();
      const service = serviceSelect.options[serviceSelect.selectedIndex].text;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const notes = document.getElementById("notes").value.trim();

      if (!clientName || !clientEmail || !clientPhone || !service || !date || !time) {
        alert("Please fill out all required fields.");
        return;
      }

      try {
        await addDoc(collection(db, "appointments", barberUID, "clientAppointments"), {
          clientName,
          clientEmail,
          clientPhone,
          service,
          date,
          time,
          notes,
          createdAt: new Date().toISOString(),
        });

        const successBox = document.getElementById("successBox");
        successBox.innerHTML = `✅ Thanks, ${clientName}!<br>Your appointment has been booked successfully.`;
        successBox.style.display = "block";
        document.getElementById("bookingForm").reset();
      } catch (error) {
        console.error("Error adding appointment:", error);
        alert("Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
